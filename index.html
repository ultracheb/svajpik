<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Свайпік</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#eee;font:15px system-ui,sans-serif;overscroll-behavior:none;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:8px 2px;font-size:14px;color:#aaa}
header .grow{flex:1}
button{font:inherit;color:#eee;background:#2a2a2a;border:0;border-radius:10px;padding:10px 14px}
button:active{background:#3a3a3a}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:2px}
.dot.ok{background:#4ade80}.dot.busy{background:#facc15}.dot.err{background:#f87171}
.bar{height:3px;background:#2a2a2a;border-radius:2px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:#4ade80;width:0}
#prompt{font-size:12px;color:#888;padding:0 2px 6px;max-height:2.6em;overflow:hidden}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#grid{--ar:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:calc((100vh - 230px)*var(--ar))}
#grid.empty{display:block;max-width:none}
.slot{aspect-ratio:var(--ar);position:relative;border-radius:10px;background:#1b1b1b;overflow:hidden}
.tile{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.tile .stamp{position:absolute;top:8px;font-weight:800;font-size:22px;padding:2px 8px;border:3px solid;border-radius:8px;opacity:0;transform:rotate(-12deg);background:#0006}
.stamp.yes{left:8px;color:#4ade80}.stamp.no{right:8px;color:#f87171;transform:rotate(12deg)}
.slot .done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;pointer-events:none}
.slot.yes{outline:3px solid #4ade80;outline-offset:-3px}
.slot.no{opacity:.25}
.slot.yes img,.slot.no img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .redo{position:absolute;inset:0;background:none;padding:0;border-radius:0}
.actions{display:flex;gap:8px;padding:10px 0;justify-content:center}
.actions button{flex:1;font-size:16px}
.actions .no{background:#4a1f1f}.actions .yes{background:#1f4a2c}
.overlay{position:fixed;inset:0;background:#111;display:none;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);z-index:5}
.overlay.on{display:flex}
.overlay .head{display:flex;gap:8px;align-items:center;padding:10px 0}
#items{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;align-content:start}
.item{background:#1b1b1b;border-radius:8px;overflow:hidden;font-size:12px}
.item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.item .row{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;gap:4px}
.item a{color:#7cb8ff;text-decoration:none}
.item .x{background:none;padding:2px 6px;color:#f87171}
#lb{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;gap:10px;padding:10px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:78vh;object-fit:contain}
#lb .actions{width:100%;max-width:500px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;padding:8px 14px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
.empty{text-align:center;color:#888;padding:40px 10px}
#setup label{display:block;color:#aaa;font-size:13px;margin:14px 0 4px}
#setup input{width:100%;background:#1b1b1b;color:#eee;border:1px solid #333;border-radius:8px;padding:10px;font:inherit}
#setup .note{color:#777;font-size:12px;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dot" id="dot"></span><span id="pos"></span><span class="grow"></span>
    <span id="cnt"></span>
    <button id="btnSet">⚙</button>
    <button id="btnList">Спіс</button>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div id="prompt"></div>
  <div id="stage"><div id="grid"></div></div>
  <div class="actions">
    <button id="undo">↶</button>
    <button class="no" id="allNo">✕ усе</button>
    <button class="yes" id="allYes">✓ усе</button>
    <button id="skip">Далей ›</button>
  </div>
</div>

<div id="list" class="overlay">
  <div class="head">
    <button id="back">← Назад</button><span style="flex:1"></span>
    <button id="copy">Копіяваць лінкі</button>
    <button id="dl">JSON</button>
  </div>
  <div id="listTitle" style="color:#aaa;padding-bottom:8px"></div>
  <div id="items"></div>
</div>

<div id="setup" class="overlay">
  <div class="head"><button id="setBack">← Назад</button><span style="flex:1"></span><span id="syncStatus" style="color:#aaa"></span></div>
  <label>GitHub токен (з доступам да gist)</label><input id="sToken" type="password" autocomplete="off">
  <label>ID гіста (пуста = створыцца новы)</label><input id="sGist" autocomplete="off">
  <div style="display:flex;gap:8px;margin-top:16px"><button id="sSave" style="flex:1">Захаваць</button><button id="sShare" style="flex:1">Спасылка для іншых девайсаў</button></div>
  <div class="note">Дызайны ляжаць у Midjourney, тут толькі jobId і твае галасы. Яны жывуць у прыватным гісце. Спасылка з #sync унутры дае доступ да гіста, не шар яе нікому.</div>
</div>

<div id="lb"><img id="lbImg"><div class="actions"><button class="no" id="lbNo">✕</button><button id="lbClose">Закрыць</button><button class="yes" id="lbYes">✓</button></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const MJ = id => `https://www.midjourney.com/jobs/${id}`;
const thumb = (id,i) => `https://cdn.midjourney.com/${id}/0_${i}_640_N.webp?method=shortest`;
const big = (id,i) => `https://cdn.midjourney.com/${id}/0_${i}.png`;
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

let jobs = [];            // [{id,prompt}]
let votes = {};           // "jobId:idx" -> [v, ts]   v: 1 like, -1 no, 2 skipped, 0 cleared
let cur = 0, hist = [];
const vget = k => votes[k] ? votes[k][0] : 0;
const key = (j,i) => jobs[j].id + ':' + i;
const isOpen = j => [0,1,2,3].some(i => !vget(key(j,i)));
const nextOpen = from => { for(let j=from;j<jobs.length;j++) if(isOpen(j)) return j; return jobs.length; };

function persist(){ store.set('svajpik.state',{jobs,votes}); }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),1600); }

/* ---------- gist sync (same pattern as the other apps) ---------- */
const FILE='svajpik.json';
let cfg = store.get('svajpik.sync',{token:'',gist:''});
if(!cfg.token){
  try{ for(let n=0;n<localStorage.length;n++){ const k=localStorage.key(n); if(k.endsWith('.sync')&&k!=='svajpik.sync'){ const o=store.get(k,null); if(o&&o.token){ cfg={token:o.token,gist:''}; break; } } } }catch(e){}
}
let syncing=false, again=false, pushT=null;
const setDot=s=>$('#dot').className='dot '+(s||'');
async function gh(method,path,body){
  const r=await fetch('https://api.github.com'+path,{method,cache:'no-store',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok) throw new Error('GitHub '+r.status); return r.json();
}
function mergeState(inc){
  const base=(inc.jobs||[]).slice(); const seen=new Set(base.map(j=>j.id));
  jobs.forEach(j=>{ if(!seen.has(j.id)) base.push(j); });
  jobs=base;
  const iv=inc.votes||{};
  for(const k in iv){ if(!votes[k]||iv[k][1]>votes[k][1]) votes[k]=iv[k]; }
}
const sigOf=(js,vs)=>JSON.stringify([js.map(j=>j.id),Object.keys(vs).sort().map(k=>[k,vs[k]])]);
async function sync(){
  if(!cfg.token) return;
  if(syncing){ again=true; return; }
  syncing=true; setDot('busy');
  try{
    const body=()=>({files:{[FILE]:{content:JSON.stringify({jobs,votes})}}});
    if(!cfg.gist){
      const g=await gh('POST','/gists',{description:'Свайпік',public:false,...body()});
      cfg.gist=g.id; store.set('svajpik.sync',cfg);
    }else{
      const g=await gh('GET','/gists/'+cfg.gist);
      const f=g.files&&g.files[FILE];
      let raw=f&&f.content; if(f&&f.truncated&&f.raw_url) raw=await (await fetch(f.raw_url,{cache:'no-store'})).text();
      const inc=raw?JSON.parse(raw):{jobs:[],votes:{}};
      const before=sigOf(jobs,votes);
      mergeState(inc); persist();
      if(sigOf(jobs,votes)!==before){ cur=nextOpen(0); render(); }
      if(sigOf(jobs,votes)!==sigOf(inc.jobs||[],inc.votes||{})) await gh('PATCH','/gists/'+cfg.gist,body());
    }
    store.set('svajpik.sync',cfg); setDot('ok');
  }catch(e){ console.error(e); setDot('err'); }
  syncing=false; if(again){ again=false; sync(); }
}
function schedulePush(){ if(!cfg.token) return; clearTimeout(pushT); pushT=setTimeout(sync,800); }

/* ---------- voting ---------- */
function vote(j,i,v){
  const k=key(j,i); votes[k]=[v,Date.now()]; if(v) hist.push(k);
  persist(); updateHeader(); schedulePush();
}

function render(){
  const g=$('#grid'); g.innerHTML=''; g.className='';
  if(!jobs.length){ g.className='empty'; g.innerHTML = cfg.token ? 'Пакуль няма дызайнаў.<br>Іх дадае Claude пасля генерацыі.' : 'Адкрый ⚙ і ўстаў токен,<br>або адкрый спасылку для сінхранізацыі.'; updateHeader(); return; }
  if(cur>=jobs.length){ g.className='empty'; g.innerHTML='Усё прагледжана 🎉<br>Адкрый «Спіс»'; updateHeader(); return; }
  const job=jobs[cur];
  const pr=new Image(); pr.onload=()=>g.style.setProperty('--ar',pr.naturalWidth/pr.naturalHeight); pr.src=thumb(job.id,0);
  [0,1,2,3].forEach(i=>{ const slot=document.createElement('div'); slot.className='slot'; g.appendChild(slot); fillSlot(slot,cur,i); });
  updateHeader();
}
function fillSlot(slot,j,i){
  const v=vget(key(j,i)), src=thumb(jobs[j].id,i);
  slot.innerHTML=''; slot.className='slot'+(v===1?' yes':v?' no':'');
  if(v){
    slot.innerHTML=`<img src="${src}"><div class="done">${v===1?'♥':''}</div><button class="redo"></button>`;
    slot.querySelector('.redo').onclick=()=>{ vote(j,i,0); fillSlot(slot,j,i); };
    return;
  }
  const t=document.createElement('div'); t.className='tile';
  t.innerHTML=`<img src="${src}"><div class="stamp yes">ТАК</div><div class="stamp no">НЕ</div>`;
  slot.appendChild(t); attachDrag(t,slot,j,i);
}
function attachDrag(t,slot,j,i){
  let sx,sy,dx=0,dy=0,down=false,moved=false;
  const yes=t.querySelector('.yes'), no=t.querySelector('.no');
  t.onpointerdown=e=>{ down=true; moved=false; dx=dy=0; sx=e.clientX; sy=e.clientY; t.setPointerCapture(e.pointerId); t.style.transition='none'; };
  t.onpointermove=e=>{
    if(!down) return; dx=e.clientX-sx; dy=e.clientY-sy;
    if(Math.abs(dx)>6||Math.abs(dy)>6) moved=true;
    t.style.transform=`translate(${dx}px,${dy*0.4}px) rotate(${dx/18}deg)`;
    yes.style.opacity=Math.max(0,Math.min(1,dx/80)); no.style.opacity=Math.max(0,Math.min(1,-dx/80));
  };
  t.onpointerup=t.onpointercancel=()=>{
    if(!down) return; down=false;
    if(!moved){ t.style.transform=''; openLB(j,i); return; }
    if(Math.abs(dx)>70) decide(t,slot,j,i,dx>0?1:-1);
    else{ t.style.transition='transform .2s'; t.style.transform=''; yes.style.opacity=no.style.opacity=0; }
  };
  t._decide=v=>decide(t,slot,j,i,v);
}
function decide(t,slot,j,i,v){
  t.style.transition='transform .22s, opacity .22s';
  t.style.transform=`translate(${v*500}px,0) rotate(${v*25}deg)`; t.style.opacity=0;
  vote(j,i,v);
  setTimeout(()=>{ fillSlot(slot,j,i); if(j===cur && !isOpen(j)) setTimeout(()=>advance(j),250); },200);
}
// j: the job that just got finished. Several tiles finish together on "✕ усе"/"✓ усе", so only the first call may move on
function advance(j){ if(j!==undefined && j!==cur) return; cur=nextOpen(0); render(); }
function skipJob(){
  if(cur>=jobs.length) return;
  [0,1,2,3].forEach(i=>{ if(!vget(key(cur,i))) votes[key(cur,i)]=[2,Date.now()]; });
  persist(); schedulePush(); advance();
}
function allVote(v){ document.querySelectorAll('.tile').forEach(t=>t._decide&&t._decide(v)); }
function undo(){
  const k=hist.pop(); if(!k){ toast('Няма што адмяняць'); return; }
  votes[k]=[0,Date.now()]; persist(); schedulePush();
  const j=jobs.findIndex(x=>x.id===k.split(':')[0]); if(j>=0){ cur=j; render(); }
}
function updateHeader(){
  const total=jobs.length, doneJobs=jobs.filter((_,j)=>!isOpen(j)).length;
  $('#pos').textContent = total ? (cur<total?`Джоб ${cur+1} / ${total}`:'Гатова') : '';
  $('#cnt').textContent = `♥ ${Object.values(votes).filter(v=>v[0]===1).length}`;
  $('#prompt').textContent = jobs[cur]?jobs[cur].prompt:'';
  $('#prog').style.width = total?(doneJobs/total*100)+'%':'0';
}

/* lightbox */
let lbRef=null;
function openLB(j,i){ lbRef=[j,i]; $('#lbImg').src=big(jobs[j].id,i); $('#lb').classList.add('on'); }
function closeLB(){ $('#lb').classList.remove('on'); lbRef=null; }
function lbVote(v){ if(!lbRef) return; const i=lbRef[1]; closeLB(); const t=document.querySelectorAll('.slot')[i].querySelector('.tile'); if(t&&t._decide) t._decide(v); }

/* list */
function likedItems(){ const out=[]; jobs.forEach((jb,j)=>[0,1,2,3].forEach(i=>{ if(vget(key(j,i))===1) out.push({job:jb,i}); })); return out; }
const linkOf = it => `${MJ(it.job.id)}?index=${it.i}`;
function showList(){
  const L=likedItems(); $('#listTitle').textContent=`Спадабалася: ${L.length}`;
  $('#items').innerHTML = L.length ? L.map(it=>`<div class="item"><a href="${linkOf(it)}" target="_blank" rel="noopener"><img src="${thumb(it.job.id,it.i)}"></a><div class="row"><a href="${linkOf(it)}" target="_blank" rel="noopener">MJ ↗</a><span>#${it.i+1}</span><button class="x" data-k="${it.job.id}:${it.i}">✕</button></div></div>`).join('') : '<div class="empty" style="grid-column:1/-1">Пакуль пуста</div>';
  $('#items').querySelectorAll('.x').forEach(b=>b.onclick=()=>{ votes[b.dataset.k]=[0,Date.now()]; persist(); schedulePush(); showList(); updateHeader(); });
  $('#list').classList.add('on');
}
async function copyText(s){ try{ await navigator.clipboard.writeText(s); return true; }catch(e){ const a=document.createElement('textarea'); a.value=s; document.body.appendChild(a); a.select(); const ok=document.execCommand('copy'); a.remove(); return ok; } }

/* setup / share */
function openSetup(){
  $('#sToken').value=cfg.token||''; $('#sGist').value=cfg.gist||'';
  $('#syncStatus').textContent=!cfg.token?'сінхранізацыя выключана':($('#dot').classList.contains('err')?'памылка сінхранізацыі':'сінхранізавана');
  $('#setup').classList.add('on');
}
$('#btnSet').onclick=openSetup; $('#setBack').onclick=()=>$('#setup').classList.remove('on');
$('#sSave').onclick=()=>{ cfg={token:$('#sToken').value.trim(),gist:$('#sGist').value.trim()}; store.set('svajpik.sync',cfg); $('#setup').classList.remove('on'); render(); sync(); };
$('#sShare').onclick=async()=>{
  if(!cfg.token){ toast('Спачатку ўстаў токен'); return; }
  if(!cfg.gist) await sync();
  if(!cfg.gist){ toast('Не атрымалася'); return; }
  const link=location.origin+location.pathname+'#sync='+encodeURIComponent(btoa(JSON.stringify(cfg)));
  try{ if(navigator.share&&matchMedia('(pointer:coarse)').matches){ await navigator.share({title:'Свайпік',url:link}); return; } }catch(e){ if(e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(link); toast('Спасылка скапіявана'); }catch(e){ prompt('',link); }
};

$('#btnList').onclick=showList; $('#back').onclick=()=>{ $('#list').classList.remove('on'); render(); };
$('#copy').onclick=async()=>{ const L=likedItems(); await copyText(L.map(linkOf).join('\n')); toast(`Скапіявана: ${L.length}`); };
$('#dl').onclick=()=>{ const L=likedItems().map(it=>({url:linkOf(it),job:it.job.id,index:it.i}));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,1)],{type:'application/json'})); a.download='liked.json'; a.click(); };
$('#undo').onclick=undo; $('#allNo').onclick=()=>allVote(-1); $('#allYes').onclick=()=>allVote(1); $('#skip').onclick=skipJob;
$('#lbClose').onclick=closeLB; $('#lbYes').onclick=()=>lbVote(1); $('#lbNo').onclick=()=>lbVote(-1);
document.addEventListener('keydown',e=>{
  if($('#lb').classList.contains('on')){ if(e.key==='Escape') closeLB(); if(e.key==='ArrowRight') lbVote(1); if(e.key==='ArrowLeft') lbVote(-1); return; }
  if(e.target.tagName==='INPUT') return;
  const t=document.querySelector('.tile');
  if(e.key==='ArrowRight'&&t) t._decide(1);
  else if(e.key==='ArrowLeft'&&t) t._decide(-1);
  else if(e.key==='ArrowDown') skipJob();
  else if(e.key==='z'||e.key==='Z') undo();
});

/* API for Claude: add the jobs of a new Midjourney batch */
window.svajpik = {
  async addJobs(list){ let n=0; const have=new Set(jobs.map(j=>j.id));
    list.forEach(j=>{ if(!have.has(j.id)){ jobs.push({id:j.id,prompt:(j.prompt||'').slice(0,160)}); have.add(j.id); n++; } });
    persist(); cur=nextOpen(0); render(); await sync(); return {added:n,total:jobs.length,gist:cfg.gist,synced:$('#dot').classList.contains('ok')}; },
  info(){ return {jobs:jobs.length,liked:likedItems().length,gist:cfg.gist,hasToken:!!cfg.token}; }
};

/* boot */
(function boot(){
  const s=store.get('svajpik.state',null); if(s){ jobs=s.jobs||[]; votes=s.votes||{}; }
  const hm=location.hash.match(/sync=([^&]+)/);
  if(hm){ try{ const c=JSON.parse(atob(decodeURIComponent(hm[1]))); if(c.token&&c.gist){ cfg=c; store.set('svajpik.sync',cfg); setTimeout(()=>toast('Падключана'),300); } }catch(e){}
    history.replaceState(null,'',location.pathname+location.search); }
  cur=nextOpen(0); render(); sync();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') sync(); });
})();
</script>
</body>
</html>
